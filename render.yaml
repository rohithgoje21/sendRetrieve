# Render Blueprint: the API and the background worker (both from this repo's
# Dockerfile) and a Redis-compatible Key Value instance. Outside services are
# connected through environment variables; values marked `sync: false` are
# entered in the Render dashboard:
#   MongoDB         e.g. MongoDB Atlas
#   object storage  Cloudflare R2, AWS S3 or MinIO (S3 API)
#   RabbitMQ        e.g. CloudAMQP (Render doesn't host it); without AMQP_URL
#                   the API runs the jobs itself and the worker isn't needed
# The env group holds what the API and the worker share. Deploys are
# triggered by GitHub Actions (deploy.yml) through each service's deploy hook.
# See "Deploying" in README.md.

envVarGroups:
  - name: sendretrieve-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      # The frontend's URL, e.g. https://sendretrieve.vercel.app (emailed links,
      # share links, and the origin allowed to connect for live updates).
      - key: APP_URL
        sync: false
      - key: AMQP_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Browser notifications (npm run vapid-keys -w server); optional.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Malware scanning: the ClamAV private service below, if you run it.
      # - key: CLAMAV_HOST
      #   value: sendretrieve-clamav

services:
  - type: web
    name: sendretrieve-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false # GitHub Actions deploys after CI passes
    envVars:
      - fromGroup: sendretrieve-shared
      # Shared with the worker: both sign and check tokens. Generated here,
      # copied to the worker below.
      - key: TOKEN_SECRET
        generateValue: true
      # Requests arrive through Vercel's proxy and then Render's.
      - key: TRUST_PROXY
        value: "2"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sendretrieve-redis
          property: connectionString
      # Optional extra frontend origins, comma-separated (e.g. preview deployments).
      - key: CORS_ORIGINS
        sync: false

  # Background jobs: malware scans, thumbnails, file cleanup, notifications,
  # analytics, scheduled sweeps. Needs AMQP_URL (RabbitMQ). Background workers
  # aren't available on Render's free plan.
  - type: worker
    name: sendretrieve-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node worker.js
    plan: starter
    autoDeploy: false
    envVars:
      - fromGroup: sendretrieve-shared
      - key: TOKEN_SECRET
        fromService:
          type: web
          name: sendretrieve-api
          envVarKey: TOKEN_SECRET
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sendretrieve-redis
          property: connectionString

  # Optional: malware scanning with ClamAV, reachable only from the API and
  # the worker (set CLAMAV_HOST in the env group). clamd needs ~1.5 GB of RAM.
  #
  # - type: pserv
  #   name: sendretrieve-clamav
  #   runtime: image
  #   image:
  #     url: docker.io/clamav/clamav:stable
  #   plan: standard
  #   disk:
  #     name: signatures
  #     mountPath: /var/lib/clamav
  #     sizeGB: 1

  - type: keyvalue
    name: sendretrieve-redis
    plan: free
    # Rate limits and lockouts must not be evicted under memory pressure.
    maxmemoryPolicy: noeviction
    # Reachable only from Render services, not the internet.
    ipAllowList: []

  # Optional: self-host MinIO on Render instead of using R2 or S3. It must be a
  # public web service, because browsers upload to it directly, and it needs
  # a persistent disk (a paid plan). Then set S3_ENDPOINT on the API to this
  # service's URL and S3_FORCE_PATH_STYLE stays true.
  #
  # - type: web
  #   name: sendretrieve-minio
  #   runtime: docker
  #   dockerfilePath: ./docker/minio/Dockerfile
  #   dockerContext: ./docker/minio
  #   dockerCommand: minio server /data --address :9000
  #   plan: starter
  #   disk:
  #     name: data
  #     mountPath: /data
  #     sizeGB: 10
  #   envVars:
  #     - key: PORT
  #       value: "9000"
  #     - key: MINIO_ROOT_USER
  #       sync: false
  #     - key: MINIO_ROOT_PASSWORD
  #       sync: false
