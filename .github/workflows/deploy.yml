# Deploys to production after CI passes on master (or main), or when run by
# hand from the Actions tab. One environment: on Render's free plan a second
# copy (e.g. staging) would share the same monthly hours, and a workspace gets
# one free Key Value. See "Free deployment" in README.md.
#
# Settings (repository Settings -> Secrets and variables -> Actions):
#   variable  APP_URL, the site's public URL. A repository variable, not an
#             environment one: deploys are skipped until it's set
#   secrets   in the "production" environment (or the repository):
#             RENDER_API_DEPLOY_HOOK (Render: service Settings -> Deploy Hook),
#             RENDER_WORKER_DEPLOY_HOOK (only if the worker service runs),
#             VERCEL_DEPLOY_HOOK (optional; Vercel usually deploys from Git
#             by itself)
#
# After triggering the deploys, the job waits until /healthz reports the
# new commit, then smoke-tests the live site.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # After CI, only pushes to this repository: a pull request from a fork
    # can come from a branch named master too.
    if: >-
      vars.APP_URL != '' && (github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_URL: ${{ vars.APP_URL }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Trigger the deploys
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK" ]; then
            echo "::error::APP_URL is set but the RENDER_API_DEPLOY_HOOK secret isn't"; exit 1
          fi
          # Deploy hooks deploy a specific commit with ?ref=
          curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK&ref=$SHA" > /dev/null
          if [ -n "$RENDER_WORKER_DEPLOY_HOOK" ]; then curl -fsS -X POST "$RENDER_WORKER_DEPLOY_HOOK&ref=$SHA" > /dev/null; fi
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null; fi
          echo "Deploys triggered for $SHA"

      # Render builds the Docker image first, which takes a few minutes.
      - name: Wait for the new version
        run: |
          for i in $(seq 1 80); do
            version=$(curl -fs --max-time 60 "$APP_URL/healthz" | jq -r '.version // empty' || true)
            if [ "$version" = "$SHA" ]; then echo "Live: $version"; exit 0; fi
            echo "Waiting ($i/80): running ${version:-unknown}"
            sleep 15
          done
          echo "::error::$SHA wasn't live after 20 minutes"; exit 1

      - name: Smoke-test the live site
        run: |
          curl -fs "$APP_URL/healthz" | jq -e '.status == "ok" or .status == "degraded"'
          curl -fs "$APP_URL/api/config" | jq -e '.maxFiles > 0'
          curl -fs "$APP_URL/" | grep -q '<div id="root">'
