<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in · sendRetrieve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div class="topbar">
        <a href="/" class="brand">sendRetrieve</a>
        <nav class="site-nav" id="siteNav" aria-label="Account"></nav>
    </div>

    <main class="container narrow">
        <section class="card">
            <h1 class="card-title">Log in</h1>
            <form id="loginForm" novalidate>
                <label class="label" for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <div class="label-row">
                    <label class="label" for="password">Password</label>
                    <a href="/forgot-password" class="small-link">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <p class="error" id="formError" role="alert" hidden></p>
                <button type="submit" class="primary">Log in</button>
            </form>
            <p class="hint center">New here? <a href="/signup" id="switchLink">Create an account</a></p>
        </section>
    </main>

    <script src="/common.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
