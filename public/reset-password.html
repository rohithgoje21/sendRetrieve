<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a new password · sendRetrieve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div class="topbar">
        <a href="/" class="brand">sendRetrieve</a>
        <nav class="site-nav" id="siteNav" aria-label="Account"></nav>
    </div>

    <main class="container narrow">
        <section class="card">
            <h1 class="card-title">Choose a new password</h1>
            <form id="resetForm" novalidate>
                <label class="label" for="password">New password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8"
                    maxlength="72" required aria-describedby="passwordHint">
                <p class="hint" id="passwordHint">At least 8 characters. You'll be logged out on your other devices.</p>

                <label class="label" for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" maxlength="72" required>

                <p class="error" id="formError" role="alert" hidden></p>
                <button type="submit" class="primary">Set password</button>
            </form>
            <p class="hint center"><a href="/forgot-password">Request a new link</a></p>
        </section>
    </main>

    <script src="/common.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
