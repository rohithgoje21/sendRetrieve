<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password · sendRetrieve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div class="topbar">
        <a href="/" class="brand">sendRetrieve</a>
        <nav class="site-nav" id="siteNav" aria-label="Account"></nav>
    </div>

    <main class="container narrow">
        <section class="card">
            <h1 class="card-title">Reset your password</h1>
            <form id="forgotForm" novalidate>
                <p class="hint">Enter your account's email and we'll send you a link to choose a new password.</p>
                <label class="label" for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <p class="error" id="formError" role="alert" hidden></p>
                <button type="submit" class="primary">Send reset link</button>
            </form>
            <p class="success" id="formSuccess" role="status" hidden></p>
            <p class="hint center"><a href="/login">Back to log in</a></p>
        </section>
    </main>

    <script src="/common.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
