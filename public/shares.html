<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My shares · sendRetrieve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div class="topbar">
        <a href="/" class="brand">sendRetrieve</a>
        <nav class="site-nav" id="siteNav" aria-label="Account"></nav>
    </div>

    <main class="container wide">
        <header class="page-header">
            <h1>My shares</h1>
            <a href="/" class="button-link">New share</a>
        </header>

        <nav class="tabs" role="tablist">
            <button class="tab" role="tab" data-status="active" aria-selected="true">Active <span class="count" data-count="active"></span></button>
            <button class="tab" role="tab" data-status="expired" aria-selected="false">Expired <span class="count" data-count="expired"></span></button>
            <button class="tab" role="tab" data-status="deleted" aria-selected="false">Deleted <span class="count" data-count="deleted"></span></button>
        </nav>

        <p class="error" id="listError" role="alert" hidden></p>
        <ul class="share-list" id="shareList" aria-live="polite"></ul>
        <p class="empty" id="emptyState" hidden></p>
        <button type="button" class="ghost" id="loadMore" hidden>Load more</button>
        <p class="hint center" id="retentionNote" hidden>Expired and deleted shares are listed for 30 days. Their content
            and files are already gone.</p>
    </main>

    <script src="/common.js"></script>
    <script src="/shares.js"></script>
</body>

</html>
