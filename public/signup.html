<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up · sendRetrieve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div class="topbar">
        <a href="/" class="brand">sendRetrieve</a>
        <nav class="site-nav" id="siteNav" aria-label="Account"></nav>
    </div>

    <main class="container narrow">
        <section class="card">
            <h1 class="card-title">Create an account</h1>
            <p class="hint">Keep track of what you've shared, see views and downloads, and delete shares early.
                You can still share without an account.</p>
            <form id="signupForm" novalidate>
                <label class="label" for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" maxlength="60" required>

                <label class="label" for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label class="label" for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8"
                    maxlength="72" required aria-describedby="passwordHint">
                <p class="hint" id="passwordHint">At least 8 characters.</p>

                <p class="error" id="formError" role="alert" hidden></p>
                <button type="submit" class="primary">Create account</button>
            </form>
            <p class="hint center">Already have an account? <a href="/login" id="switchLink">Log in</a></p>
        </section>
    </main>

    <script src="/common.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
