# clamd settings for sendRetrieve (mounted over the image's default).
# The image's own settings:
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Files are streamed to clamd by the processing worker (INSTREAM). The
# defaults (25 MB) are below the app's upload limit, so raise them. Anything
# larger than StreamMaxLength is refused, and the worker treats that as a
# scan failure (fail closed), never as clean.
StreamMaxLength 600M
MaxFileSize 600M
MaxScanSize 600M
# Archives: scan inside, within limits that keep zip bombs harmless.
MaxRecursion 16
MaxFiles 10000
