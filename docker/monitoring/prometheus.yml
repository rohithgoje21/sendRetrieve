# Prometheus for the Docker Compose stack (docker compose --profile monitoring up).
# Scrapes the API, every worker container and RabbitMQ; alert rules are in
# alerts.yml and go to Alertmanager.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The API's metrics port (METRICS_PORT, not published outside Docker).
  - job_name: api
    static_configs:
      - targets: ["app:9091"]

  # Every worker container (docker compose up --scale worker=3): the service
  # name resolves to all of them.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9092
        refresh_interval: 30s

  # RabbitMQ's built-in Prometheus endpoint.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
